apply plugin: 'com.android.library'
apply plugin: 'kotlin-parcelize'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    compileSdk = libs.versions.compileSdk.get().toInteger()

    namespace "com.kirchhoff.movies"

    defaultConfig {
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        compose true
        buildConfig true
    }

    lint {
        disable += ['Typos', 'ContentDescription', 'GradleDependency', 'AndroidGradlePluginVersion']
        // ui-tooling brings Material 3 at runtime for previews; app UI uses Material 2 only.
        disable += ['UsingMaterialAndMaterial3Libraries']
        warningsAsErrors = true
    }
}

dependencies {
    implementation libs.kotlin
    implementation libs.coreKtx
    implementation libs.material

    implementation platform(libs.composeBom)
    implementation libs.bundles.compose

    debugImplementation libs.composeUITooling
    debugImplementation libs.leakCanary
}

apply from: rootProject.file('buildsystem/detekt-android.gradle')
