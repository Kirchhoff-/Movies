[versions]
buildToolsPlugin = "9.4.1"
minSdk = "23"
targetSdk = "37"
compileSdk = "37"
versionName = "1.24.0"
versionCode = "24"

material = "1.14.0"
constraintLayout = "2.2.2"
coreKtx = "1.19.1"

composeBom = "2026.09.00"

appCompat = "1.8.0"
activityCompose = "1.13.0"

kotlin = "2.4.21"
coroutines = "1.11.0"

lifecycle = "2.11.0"

retrofit = "3.0.0"
okhttp = "5.5.1"
gson = "2.15.0"

koin = "4.2.2"

coil = "3.6.3"

pagerIndicator = "1.2.5"

timber = "5.0.1"

leakCanary = "2.14"

junit = "4.13.2"

ktlint = "14.2.0"
detekt = "1.23.8"
konsist = "0.18.1"

[libraries]
plugin-buildTools = { module = "com.android.tools.build:gradle", version.ref = "buildToolsPlugin" }
plugin-composeCompiler = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
plugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-detekt = { module = "io.gitlab.arturbosch.detekt:io.gitlab.arturbosch.detekt.gradle.plugin", version.ref = "detekt" }
plugin-ktlint = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint" }

appCompat = { module = "androidx.appcompat:appcompat", version.ref = "appCompat" }
activityCompose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
material = { module = "com.google.android.material:material", version.ref = "material" }
constraintLayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintLayout" }
coreKtx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }

kotlin = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
liveData = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
viewModel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
composeLifeCycle = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

koin = { module = "io.insert-koin:koin-android", version.ref = "koin" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofitConverter = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okHttpInterceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

coil = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }
coilNetwork = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
coilCompose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }

pagerIndicator = { module = "ru.tinkoff.scrollingpagerindicator:scrollingpagerindicator", version.ref = "pagerIndicator" }

timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

leakCanary = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakCanary" }

junit = { module = "junit:junit", version.ref = "junit" }

konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }

composeBom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }

# Versions of the following Compose libraries are managed by composeBom.
composeAnimation = { module = "androidx.compose.animation:animation" }
composeIcons = { module = "androidx.compose.material:material-icons-core" }
composeMaterial = { module = "androidx.compose.material:material" }
composeUI = { module = "androidx.compose.ui:ui" }
composeUIPreview = { module = "androidx.compose.ui:ui-tooling-preview" }
composeUITooling = { module = "androidx.compose.ui:ui-tooling" }
composeFoundation = { module = "androidx.compose.foundation:foundation" }
composeLiveData = { module = "androidx.compose.runtime:runtime-livedata" }

[bundles]
architectureComponents = ["lifecycle", "liveData", "viewModel"]
internet = ["retrofit", "retrofitConverter", "okHttpInterceptor"]
di = ["koin"]
tests = ["junit"]
compose = ["composeIcons", "composeAnimation", "composeMaterial", "activityCompose", "composeUI", "composeUIPreview", "composeFoundation", "composeLiveData", "composeLifeCycle"]
imageLoading = ["coil", "coilCompose", "coilNetwork"]
